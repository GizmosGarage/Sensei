[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei-calculus-tutor"
version = "0.6.0"
description = "A local-first adaptive math tutor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GizmosGarage" }]
dependencies = ["sympy==1.14.0"]

[project.scripts]
sensei = "sensei.cli:main"
sensei-dashboard = "sensei.dashboard:main"

[tool.setuptools.packages.find]
include = ["sensei*"]

[tool.setuptools.package-data]
sensei = ["web/*.html", "web/*.css", "web/*.js"]
