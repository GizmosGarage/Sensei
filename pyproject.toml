[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei-calculus-tutor"
version = "0.9.0"
description = "An API-backed tutor with learner-owned local SQLite memory"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GizmosGarage" }]
dependencies = [
    "python-dotenv>=1.0,<2",
    "sympy==1.14.0",
]

[project.scripts]
sensei = "sensei.cli:main"
sensei-dashboard = "sensei.dashboard:main"

[tool.setuptools.packages.find]
include = ["sensei*"]

[tool.setuptools.package-data]
sensei = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/vendor/katex/*.css",
    "web/vendor/katex/*.js",
    "web/vendor/katex/LICENSE",
    "web/vendor/katex/contrib/*.js",
    "web/vendor/katex/fonts/*.woff2",
]
