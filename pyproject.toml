[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei-calculus-tutor"
version = "0.1.0"
description = "A local-first adaptive calculus tutor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GizmosGarage" }]
dependencies = []

[project.scripts]
sensei = "sensei.cli:main"

[tool.setuptools.packages.find]
include = ["sensei*"]
